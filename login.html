<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | InvestKit</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--accent) 100%);
        }

        .auth-card {
            background: var(--light);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: all 0.3s ease;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--light);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--accent);
        }

        .divider span {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .oauth-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .oauth-btn {
            padding: 10px;
            border: 2px solid var(--accent);
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .oauth-btn:hover {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.05);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
        }

        .auth-toggle a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 20px;
            }

            .oauth-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- FORM CONNEXION -->
            <div class="form-container active" id="loginForm">
                <h2>Connexion</h2>

                <div class="oauth-buttons">
                    <button class="oauth-btn" onclick="alert('Google OAuth bientôt disponible')">📧 Google</button>
                    <button class="oauth-btn" onclick="alert('GitHub OAuth bientôt disponible')">🐙 GitHub</button>
                </div>

                <div class="divider"><span>ou</span></div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="vous@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Se souvenir de moi</label>
                    </div>

                    <button type="submit" class="btn-submit">Se Connecter</button>
                </form>

                <div class="auth-toggle">
                    Pas encore inscrit ?
                    <a onclick="toggleForms()">Créer un compte</a>
                </div>
            </div>

            <!-- FORM INSCRIPTION -->
            <div class="form-container" id="registerForm">
                <h2>Inscription</h2>

                <div class="oauth-buttons">
                    <button class="oauth-btn" onclick="alert('Google OAuth bientôt disponible')">📧 Google</button>
                    <button class="oauth-btn" onclick="alert('GitHub OAuth bientôt disponible')">🐙 GitHub</button>
                </div>

                <div class="divider"><span>ou</span></div>

                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="firstName">Prénom</label>
                        <input type="text" id="firstName" name="firstName" placeholder="Andreja" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Nom</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Simic" required>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" name="regEmail" placeholder="vous@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Mot de passe</label>
                        <input type="password" id="regPassword" name="regPassword" placeholder="Min. 8 caractères" required>
                    </div>

                    <div class="form-group">
                        <label for="profil">Profil d'investisseur</label>
                        <select id="profil" name="profil" required>
                            <option value="">Choisissez votre profil...</option>
                            <option value="debutant">Débutant (< 5 ans)</option>
                            <option value="intermediaire">Intermédiaire (5-15 ans)</option>
                            <option value="expert">Expert (15+ ans)</option>
                        </select>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">J'accepte les <a href="#" style="color: var(--primary);">conditions d'utilisation</a></label>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">M'envoyer des actualités (optionnel)</label>
                    </div>

                    <button type="submit" class="btn-submit">Créer un Compte</button>
                </form>

                <div class="auth-toggle">
                    Vous avez un compte ?
                    <a onclick="toggleForms()">Se connecter</a>
                </div>
            </div>

            <!-- Back to Home -->
            <div style="text-align: center; margin-top: 30px;">
                <a href="index.html" style="color: var(--text-light); text-decoration: none; font-size: 0.9rem;">
                    ← Retour à l'accueil
                </a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('active');
            document.getElementById('registerForm').classList.toggle('active');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await login(email, password);
            
            if (result.success) {
                alert(`✅ Connexion réussie !`);
                setTimeout(() => {
                    window.location.href = 'settings.html';
                }, 1000);
            } else {
                alert(`❌ Erreur: ${result.error}`);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const profile = document.getElementById('profil').value;

            const result = await register(email, password, firstName, lastName, profile);
            
            console.log('Backend response:', result);
            
            if (result.success) {
                console.log('Token:', result.data.token);
                alert(`✅ Inscription réussie ! Vous allez être redirigé.`);
                localStorage.setItem('authToken', result.data.token);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', firstName);
                
                setTimeout(() => {
                    window.location.href = 'settings.html';
                }, 1500);
            } else {
                alert(`❌ Erreur: ${result.error}`);
            }
        }

        // Auto-fill si déjà connecté
        window.addEventListener('load', () => {
            if (isLoggedIn()) {
                window.location.href = 'settings.html';
            }
        });
    </script>
</body>
</html>
